# omnisense/omnireach with every omnireach/* provider:
#
#   docker compose run --rm omnireach test       # every package's tests (recorded answers, no network)
#   docker compose run --rm omnireach bare       # plain PHP: search and audience reports asked through a Registry - and what PHP loaded
#   docker compose run --rm omnireach live       # the checks that need no account (Matomo's public demo)
#   docker compose run --rm omnireach phpstan    # PHPStan, each package at the highest level
#   docker compose down -v                        # the harness's volume gone
#
# Providers come from GitHub (branch 1.x) unless their checkout sits under OMNIREACH_PLUGINS (set it
# to ../.. in .env when this core sits in the workspace beside them): then that checkout is what runs.
name: omnireach-harness

services:
  omnireach:
    build: .
    image: omnisense/omnireach-harness
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnireach/core
      - ${OMNIREACH_PLUGINS:-./plugins}:/omnireach/plugins:ro
      - harness:/harness

volumes:
  harness:
